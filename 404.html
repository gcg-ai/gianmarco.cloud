<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --bg:#FFFFFF;
    --text:#141414;
    --muted:#6B6B6B;
    --faint:#A3A3A3;
    --accent:#141414;
    --border:#E4E4E4;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Outfit',-apple-system,sans-serif;
    --mono:'Fira Code',monospace;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#0B0B0B;
      --text:#F4F4F4;
      --muted:#9A9A9A;
      --faint:#5C5C5C;
      --accent:#F4F4F4;
      --border:#262626;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:28px;
  }
  .container{
    text-align:center;
    max-width:520px;
  }
  .code{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(4rem,12vw,7rem);
    line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
  }
  .rule{
    width:42px;
    height:1px;
    background:var(--accent);
    margin:28px auto 24px;
  }
  .caption{
    font-family:var(--sans);
    font-size:.65rem;
    font-weight:400;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--faint);
    margin-bottom:24px;
  }
  .opinion{
    font-family:var(--serif);
    font-size:clamp(1rem,2.2vw,1.2rem);
    font-weight:400;
    font-style:italic;
    line-height:1.65;
    color:var(--muted);
    margin-bottom:12px;
    text-align:left;
  }
  .opinion em{
    font-style:normal;
    font-weight:600;
    color:var(--text);
  }
  .held{
    font-family:var(--serif);
    font-size:clamp(.95rem,2vw,1.1rem);
    font-weight:400;
    line-height:1.6;
    color:var(--muted);
    text-align:left;
    margin-bottom:32px;
  }
  .held strong{
    font-weight:600;
    color:var(--text);
    letter-spacing:.04em;
  }
  .cite{
    font-family:var(--mono);
    font-size:.7rem;
    color:var(--faint);
    letter-spacing:.02em;
    margin-bottom:36px;
    text-align:left;
  }
  .back{
    display:inline-block;
    font-family:var(--sans);
    font-size:.75rem;
    font-weight:400;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:100px;
    padding:13px 30px;
    transition:border-color .4s ease,letter-spacing .4s ease;
  }
  .back:hover{
    border-color:var(--accent);
    letter-spacing:.24em;
  }
</style>
</head>
<body>
  <div class="container">
    <p class="code">404</p>
    <div class="rule"></div>
    <p class="caption">Opinion of the Court</p>
    <p class="opinion">The page sought by the petitioner does not exist within this domain, has been relocated, or was never duly published.</p>
    <p class="held">This Court lacks jurisdiction over the requested URL. The petition is hereby <strong>DISMISSED</strong>.</p>
    <p class="cite">Per curiam.</p>
    <a class="back" href="/">Return to chambers</a>
  </div>
</body>
</html>
