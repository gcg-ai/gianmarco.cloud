<style>
  :root{
    --bg:#FFFFFF;
    --text:#141414;
    --muted:#6B6B6B;
    --faint:#A3A3A3;
    --accent:#141414;
    --border:#E4E4E4;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Outfit',-apple-system,sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#0B0B0B;
      --text:#F4F4F4;
      --muted:#9A9A9A;
      --faint:#5C5C5C;
      --accent:#F4F4F4;
      --border:#262626;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:28px;
  }
  .container{
    text-align:center;
    max-width:440px;
  }
  .code{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(4rem,12vw,7rem);
    line-height:1;
    letter-spacing:-.02em;
    color:var(--text);
  }
  .rule{
    width:42px;
    height:1px;
    background:var(--accent);
    margin:28px auto 24px;
  }
  .message{
    font-family:var(--serif);
    font-size:clamp(1.1rem,2.5vw,1.35rem);
    font-weight:400;
    font-style:italic;
    line-height:1.5;
    color:var(--muted);
    margin-bottom:36px;
  }
  .monogram{
    width:46px;
    margin:0 auto 24px;
  }
  .monogram img{
    width:100%;
    height:auto;
    display:block;
  }
  @media(prefers-color-scheme:dark){
    .monogram img{filter:invert(1)}
  }
  .back{
    display:inline-block;
    font-family:var(--sans);
    font-size:.75rem;
    font-weight:400;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:100px;
    padding:13px 30px;
    transition:border-color .4s ease,letter-spacing .4s ease;
  }
  .back:hover{
    border-color:var(--accent);
    letter-spacing:.24em;
  }
</style>
</head>
